name: Main Branch Release Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
      - run: docker build .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-artifacts
          path: |
            playwright-report
            test-results
